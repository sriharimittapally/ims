spring.application.name=ims

server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/ims_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret.key=inventra_intelligent_inventory_management_system_super_key
jwt.expiration.ms=7200000

#bootstrap admin
admin.default.email=admin@inventra.com
